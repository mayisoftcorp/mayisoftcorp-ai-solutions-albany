<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">AI receptionist workflow</title><desc id="desc">A vibrant diagram showing an AI receptionist answering calls, capturing details, checking calendar availability and booking appointments.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#180b35"/><stop offset=".5" stop-color="#123b5c"/><stop offset="1" stop-color="#064e3b"/></linearGradient><linearGradient id="hot" x1="0" x2="1"><stop stop-color="#fb7185"/><stop offset="1" stop-color="#facc15"/></linearGradient><linearGradient id="cool" x1="0" x2="1"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#72f2c7"/></linearGradient></defs><rect width="1200" height="720" rx="42" fill="url(#bg)"/><g font-family="Inter,Arial,sans-serif"><text x="70" y="92" fill="#facc15" font-size="24" font-weight="900" letter-spacing="4">AI RECEPTIONIST WORKFLOW</text><text x="70" y="145" fill="#fff" font-size="54" font-weight="950">Never lose a ready lead to a missed call</text><text x="70" y="188" fill="#cbd5e1" font-size="23">Calls, forms and chats become qualified appointments.</text></g><g font-family="Inter,Arial,sans-serif" font-weight="900"><circle cx="170" cy="410" r="88" fill="url(#hot)"/><text x="170" y="394" text-anchor="middle" fill="#111827" font-size="25">Inbound</text><text x="170" y="430" text-anchor="middle" fill="#111827" font-size="25">Lead</text><rect x="330" y="320" width="210" height="180" rx="34" fill="#0f172a" stroke="#38bdf8" stroke-width="4"/><text x="435" y="378" text-anchor="middle" fill="#38bdf8" font-size="28">AI</text><text x="435" y="418" text-anchor="middle" fill="#fff" font-size="24">Receptionist</text><text x="435" y="457" text-anchor="middle" fill="#cbd5e1" font-size="18">answers + qualifies</text><rect x="660" y="245" width="190" height="120" rx="28" fill="url(#cool)"/><text x="755" y="294" text-anchor="middle" fill="#082f49" font-size="24">Calendar</text><text x="755" y="328" text-anchor="middle" fill="#082f49" font-size="19">availability</text><rect x="660" y="455" width="190" height="120" rx="28" fill="#f0abfc"/><text x="755" y="504" text-anchor="middle" fill="#3b0764" font-size="24">CRM</text><text x="755" y="538" text-anchor="middle" fill="#3b0764" font-size="19">lead record</text><rect x="970" y="330" width="170" height="170" rx="34" fill="#fff"/><text x="1055" y="390" text-anchor="middle" fill="#111827" font-size="25">Booked</text><text x="1055" y="430" text-anchor="middle" fill="#111827" font-size="25">Meeting</text><text x="1055" y="466" text-anchor="middle" fill="#4b5563" font-size="17">with reminders</text></g><g fill="none" stroke-width="10" stroke-linecap="round"><path d="M258 410 H330" stroke="#fb7185"/><path d="M540 374 C610 335 610 305 660 305" stroke="#38bdf8"/><path d="M540 446 C610 485 610 515 660 515" stroke="#f0abfc"/><path d="M850 305 C930 305 920 386 970 386" stroke="#72f2c7"/><path d="M850 515 C930 515 920 444 970 444" stroke="#facc15"/></g></svg>