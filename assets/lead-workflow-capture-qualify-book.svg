<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Colorful AI lead workflow: capture, qualify, book</title><desc id="desc">A colorful workflow diagram showing leads from website, calls, email and chat entering an AI assistant, being qualified, routed to CRM and booked as consultations.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#09152a"/><stop offset=".45" stop-color="#172b6b"/><stop offset="1" stop-color="#0b3b4a"/></linearGradient><linearGradient id="g1" x1="0" x2="1"><stop stop-color="#72f2c7"/><stop offset="1" stop-color="#8eb6ff"/></linearGradient><linearGradient id="g2" x1="0" x2="1"><stop stop-color="#ffd166"/><stop offset="1" stop-color="#ff7ab6"/></linearGradient><linearGradient id="g3" x1="0" x2="1"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-opacity=".35"/></filter></defs><rect width="1200" height="720" rx="42" fill="url(#bg)"/><circle cx="1000" cy="110" r="220" fill="#72f2c7" opacity=".14"/><circle cx="150" cy="620" r="260" fill="#ff7ab6" opacity=".12"/><g font-family="Inter,Arial,sans-serif"><text x="70" y="86" fill="#72f2c7" font-size="24" font-weight="800" letter-spacing="4">MAYISOFTCORP LEAD SYSTEM</text><text x="70" y="132" fill="#eef7ff" font-size="48" font-weight="900">From inbound interest to booked AI audit</text><text x="70" y="172" fill="#b8c7dc" font-size="22">Capture → Qualify → Route → Follow up → Book</text></g><g filter="url(#shadow)" font-family="Inter,Arial,sans-serif" font-weight="800"><g transform="translate(70 255)"><rect width="180" height="116" rx="24" fill="#0f213a" stroke="#72f2c7"/><text x="90" y="42" text-anchor="middle" fill="#72f2c7" font-size="22">Website</text><text x="90" y="76" text-anchor="middle" fill="#eef7ff" font-size="18">Form lead</text></g><g transform="translate(70 410)"><rect width="180" height="116" rx="24" fill="#0f213a" stroke="#ffd166"/><text x="90" y="42" text-anchor="middle" fill="#ffd166" font-size="22">Calls</text><text x="90" y="76" text-anchor="middle" fill="#eef7ff" font-size="18">Missed calls</text></g><g transform="translate(70 565)"><rect width="180" height="96" rx="24" fill="#0f213a" stroke="#ff7ab6"/><text x="90" y="39" text-anchor="middle" fill="#ff7ab6" font-size="22">Email</text><text x="90" y="70" text-anchor="middle" fill="#eef7ff" font-size="18">Inquiries</text></g><g transform="translate(360 335)"><rect width="230" height="150" rx="30" fill="url(#g3)"/><text x="115" y="48" text-anchor="middle" fill="#06111f" font-size="28">AI Assistant</text><text x="115" y="88" text-anchor="middle" fill="#06111f" font-size="19">answers, asks,</text><text x="115" y="116" text-anchor="middle" fill="#06111f" font-size="19">qualifies & routes</text></g><g transform="translate(700 250)"><rect width="190" height="116" rx="24" fill="url(#g1)"/><text x="95" y="43" text-anchor="middle" fill="#06111f" font-size="24">CRM</text><text x="95" y="76" text-anchor="middle" fill="#06111f" font-size="18">Save lead</text></g><g transform="translate(700 420)"><rect width="190" height="116" rx="24" fill="url(#g2)"/><text x="95" y="43" text-anchor="middle" fill="#06111f" font-size="24">Email Alert</text><text x="95" y="76" text-anchor="middle" fill="#06111f" font-size="18">Notify team</text></g><g transform="translate(980 335)"><rect width="160" height="150" rx="30" fill="#fff"/><text x="80" y="44" text-anchor="middle" fill="#172b6b" font-size="24">Booked</text><text x="80" y="78" text-anchor="middle" fill="#172b6b" font-size="18">AI Audit</text><text x="80" y="112" text-anchor="middle" fill="#172b6b" font-size="18">or Quote</text></g></g><g fill="none" stroke-linecap="round" stroke-width="9"><path d="M250 313 C300 313 315 385 360 385" stroke="#72f2c7"/><path d="M250 468 C300 468 315 415 360 415" stroke="#ffd166"/><path d="M250 613 C318 613 310 455 360 455" stroke="#ff7ab6"/><path d="M590 385 C645 350 660 308 700 308" stroke="#72f2c7"/><path d="M590 430 C645 450 660 478 700 478" stroke="#ffd166"/><path d="M890 308 C942 308 940 385 980 385" stroke="#8eb6ff"/><path d="M890 478 C945 478 940 435 980 435" stroke="#ff7ab6"/></g></svg>