<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Microsoft Copilot and Claude automation map</title><desc id="desc">A colorful architecture map showing Microsoft Copilot, Claude, CRM, email, calendar and AI agents connected to business workflows.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#020617"/><stop offset=".5" stop-color="#1e1b4b"/><stop offset="1" stop-color="#042f2e"/></linearGradient><linearGradient id="blue" x1="0" x2="1"><stop stop-color="#60a5fa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient><linearGradient id="purple" x1="0" x2="1"><stop stop-color="#c084fc"/><stop offset="1" stop-color="#f472b6"/></linearGradient><linearGradient id="green" x1="0" x2="1"><stop stop-color="#34d399"/><stop offset="1" stop-color="#bef264"/></linearGradient></defs><rect width="1200" height="720" rx="42" fill="url(#bg)"/><text x="70" y="92" fill="#22d3ee" font-family="Inter,Arial" font-size="24" font-weight="900" letter-spacing="4">AI WORKFLOW ARCHITECTURE</text><text x="70" y="145" fill="#fff" font-family="Inter,Arial" font-size="52" font-weight="950">Copilot + Claude + AI Agents</text><text x="70" y="188" fill="#cbd5e1" font-family="Inter,Arial" font-size="23">Connect daily tools into one practical automation system.</text><g font-family="Inter,Arial" font-weight="900"><rect x="90" y="300" width="210" height="120" rx="28" fill="url(#blue)"/><text x="195" y="350" text-anchor="middle" fill="#07111f" font-size="25">Microsoft</text><text x="195" y="386" text-anchor="middle" fill="#07111f" font-size="25">Copilot</text><rect x="90" y="480" width="210" height="120" rx="28" fill="url(#purple)"/><text x="195" y="530" text-anchor="middle" fill="#17051f" font-size="28">Claude</text><text x="195" y="566" text-anchor="middle" fill="#17051f" font-size="20">workflows</text><circle cx="580" cy="420" r="125" fill="url(#green)"/><text x="580" y="392" text-anchor="middle" fill="#052e16" font-size="31">AI Agent</text><text x="580" y="432" text-anchor="middle" fill="#052e16" font-size="22">orchestrates</text><text x="580" y="468" text-anchor="middle" fill="#052e16" font-size="20">tasks + handoffs</text><rect x="870" y="245" width="220" height="92" rx="23" fill="#facc15"/><text x="980" y="302" text-anchor="middle" fill="#111827" font-size="24">Email + Calendar</text><rect x="870" y="380" width="220" height="92" rx="23" fill="#fb7185"/><text x="980" y="437" text-anchor="middle" fill="#111827" font-size="24">CRM + Leads</text><rect x="870" y="515" width="220" height="92" rx="23" fill="#a7f3d0"/><text x="980" y="572" text-anchor="middle" fill="#052e16" font-size="24">Support + Ops</text></g><g fill="none" stroke-width="10" stroke-linecap="round"><path d="M300 360 C390 360 420 390 465 402" stroke="#60a5fa"/><path d="M300 540 C390 540 420 465 465 445" stroke="#f472b6"/><path d="M705 390 C790 330 805 292 870 292" stroke="#facc15"/><path d="M705 420 H870" stroke="#fb7185"/><path d="M705 455 C790 525 805 560 870 560" stroke="#a7f3d0"/></g></svg>